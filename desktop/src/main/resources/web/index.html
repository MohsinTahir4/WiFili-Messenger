<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFili Messenger • Web Edition (Offline LAN)</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --accent-blue: #1e65f3;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --bubble-sent: #1e65f3;
            --bubble-recv: #334155;
            --border-color: #475569;
        }

        .light-theme {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #f1f5f9;
            --accent-blue: #1e65f3;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --bubble-sent: #1e65f3;
            --bubble-recv: #e2e8f0;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Navigation */
        header {
            background-color: var(--bg-secondary);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: var(--accent-blue);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .logo-title {
            font-size: 18px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-badge {
            background: var(--bg-card);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot-online {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
        }

        .btn-danger {
            background: var(--accent-red);
            color: white;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            justify-content: center;
        }

        /* App Container */
        .app-container {
            flex: 1;
            display: flex;
            height: calc(100vh - 64px);
        }

        /* Sidebar - Users List */
        .sidebar {
            width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 13px;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }

        .user-item:hover, .user-item.active {
            background: var(--bg-card);
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: white;
            position: relative;
        }

        .user-info {
            flex: 1;
            overflow: hidden;
        }

        .user-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-sub {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* Chat Main Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .chat-header {
            background: var(--bg-secondary);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .active-user-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .call-buttons {
            display: flex;
            gap: 10px;
        }

        .messages-timeline {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 65%;
        }

        .msg-row.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-row.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
        }

        .msg-row.sent .msg-bubble {
            background: var(--bubble-sent);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .msg-row.received .msg-bubble {
            background: var(--bubble-recv);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .msg-time {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
            padding: 0 4px;
        }

        .file-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.15);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
        }

        /* Bottom Input Bar */
        .chat-input-bar {
            background: var(--bg-secondary);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border-color);
        }

        .input-box-wrapper {
            flex: 1;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 14px;
        }

        /* Call Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .call-card {
            background: var(--bg-secondary);
            width: 480px;
            padding: 32px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .video-container {
            width: 100%;
            height: 260px;
            background: black;
            border-radius: 12px;
            margin: 16px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .call-ctrls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }

        /* Emoji Picker Popover */
        .emoji-popover {
            position: absolute;
            bottom: 70px;
            left: 340px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .emoji-btn {
            font-size: 22px;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            transition: background 0.15s;
        }

        .emoji-btn:hover {
            background: var(--bg-card);
        }

        .empty-users-view {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-sub);
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-group">
            <div class="logo-icon">📶</div>
            <div class="logo-title">WiFili Messenger <span style="font-size:12px; color:var(--accent-blue); font-weight:normal;">• Web Edition</span></div>
        </div>

        <div class="header-actions">
            <div class="user-badge">
                <span class="dot-online"></span>
                <span id="txt-my-ip">Scanning Local Wi-Fi...</span>
            </div>
            <button class="btn btn-secondary" onclick="toggleTheme()">🌓 Theme</button>
            <button class="btn" onclick="scanLAN()">⚡ Scan LAN Users</button>
        </div>
    </header>

    <!-- Main App Split View -->
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="input-search" placeholder="Search connected LAN users..." onkeyup="filterUsers()">
                </div>
            </div>

            <div class="users-list" id="users-list-container">
                <!-- User Items populated dynamically -->
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="active-user-group">
                    <div class="user-avatar" id="active-avatar">?</div>
                    <div>
                        <div class="user-name" id="active-name">No User Selected</div>
                        <div class="user-sub" id="active-status">Scan and select a LAN user on the left to start chatting</div>
                    </div>
                </div>

                <div class="call-buttons">
                    <button class="btn btn-secondary btn-icon" onclick="startCall('audio')" title="Audio Call">📞</button>
                    <button class="btn btn-secondary btn-icon" onclick="startCall('video')" title="Video Call">🎥</button>
                    <button class="btn btn-secondary btn-icon" onclick="openGuide()" title="How to Use">❓</button>
                </div>
            </div>

            <!-- Messages Timeline -->
            <div class="messages-timeline" id="timeline">
                <div style="text-align:center; color:var(--text-sub); margin-top:40px; font-size:13px;">
                    🔒 End-to-End Direct LAN Wi-Fi Connection • 100% Offline &amp; Private
                </div>
            </div>

            <!-- Emoji Popover -->
            <div class="emoji-popover" id="emoji-popover">
                <div class="emoji-btn" onclick="insertEmoji('😀')">😀</div>
                <div class="emoji-btn" onclick="insertEmoji('😂')">😂</div>
                <div class="emoji-btn" onclick="insertEmoji('😍')">😍</div>
                <div class="emoji-btn" onclick="insertEmoji('😎')">😎</div>
                <div class="emoji-btn" onclick="insertEmoji('👍')">👍</div>
                <div class="emoji-btn" onclick="insertEmoji('❤️')">❤️</div>
                <div class="emoji-btn" onclick="insertEmoji('🔥')">🔥</div>
                <div class="emoji-btn" onclick="insertEmoji('🎉')">🎉</div>
                <div class="emoji-btn" onclick="insertEmoji('🙏')">🙏</div>
                <div class="emoji-btn" onclick="insertEmoji('👋')">👋</div>
                <div class="emoji-btn" onclick="insertEmoji('🥳')">🥳</div>
                <div class="emoji-btn" onclick="insertEmoji('💡')">💡</div>
            </div>

            <!-- Bottom Input Bar -->
            <div class="chat-input-bar">
                <button class="btn btn-secondary btn-icon" onclick="toggleEmojiPicker()">😀</button>
                <button class="btn btn-secondary btn-icon" onclick="document.getElementById('file-picker').click()">📎</button>
                <input type="file" id="file-picker" style="display:none;" onchange="handleFileSelect(event)">

                <div class="input-box-wrapper">
                    <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                </div>

                <button class="btn" onclick="sendMessage()">Send ➔</button>
            </div>
        </div>
    </div>

    <!-- Call Overlay Modal -->
    <div class="modal-overlay" id="call-modal">
        <div class="call-card">
            <div class="user-avatar" style="width:72px; height:72px; font-size:32px; margin:0 auto 12px auto;" id="call-avatar">?</div>
            <h2 id="call-peer-title">Peer Name</h2>
            <p style="color:var(--text-sub); margin-top:4px;" id="call-status-lbl">Calling...</p>

            <div class="video-container" id="video-area" style="display:none;">
                <video id="remote-video" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
            </div>

            <div class="call-ctrls">
                <button class="btn btn-secondary btn-icon" onclick="toggleMic()" id="btn-mic">🎙️</button>
                <button class="btn btn-secondary btn-icon" onclick="toggleSpeaker()" id="btn-spk">🔊</button>
                <button class="btn btn-danger btn-icon" onclick="endCall()" style="width:48px; height:48px; font-size:20px;">🔴</button>
            </div>
        </div>
    </div>

    <script>
        let currentPeer = null;
        let users = []; // Real discovered users array (starts completely empty)

        async function fetchPeers() {
            try {
                const response = await fetch('/api/peers');
                if (response.ok) {
                    const realUsers = await response.json();
                    users = realUsers;
                    renderUsers(users);
                } else {
                    renderUsers([]);
                }
            } catch (err) {
                renderUsers(users);
            }
        }

        function renderUsers(userList) {
            const container = document.getElementById('users-list-container');
            container.innerHTML = '';

            if (!userList || userList.length === 0) {
                container.innerHTML = `
                    <div class="empty-users-view">
                        <div style="font-size:36px; margin-bottom:8px;">📶</div>
                        <strong>Searching for LAN Users...</strong><br>
                        No other WiFili users found on this Wi-Fi yet.<br><br>
                        <small style="color:var(--accent-blue);">Connect another phone or PC to the same Wi-Fi / Hotspot and tap 'Scan LAN Users'.</small>
                    </div>
                `;
                return;
            }

            userList.forEach(u => {
                const item = document.createElement('div');
                item.className = 'user-item' + (currentPeer && currentPeer.id === u.id ? ' active' : '');
                item.onclick = () => selectUser(u);
                item.innerHTML = `
                    <div class="user-avatar">${u.name.charAt(0).toUpperCase()}</div>
                    <div class="user-info">
                        <div class="user-name">${u.name}</div>
                        <div class="user-sub">📶 ${u.ip} • ${u.status}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function selectUser(user) {
            currentPeer = user;
            document.getElementById('active-name').innerText = user.name;
            document.getElementById('active-status').innerText = '📶 ' + user.ip + ' • Online';
            document.getElementById('active-avatar').innerText = user.name.charAt(0).toUpperCase();
            renderUsers(users);
        }

        function filterUsers() {
            const q = document.getElementById('input-search').value.toLowerCase();
            const filtered = users.filter(u => u.name.toLowerCase().includes(q) || u.ip.includes(q));
            renderUsers(filtered);
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            if (!currentPeer) {
                alert('⚠️ You are not connected to any user.\n\nHow to Fix:\n1. Select an online user from the left list.\n2. Or click "Scan LAN Users" to find nearby devices on your Wi-Fi.');
                return;
            }

            appendBubble(text, 'sent');
            input.value = '';

            try {
                await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: currentPeer.ip, text: text })
                });
            } catch (err) {
                alert('⚠️ You are not connected to ' + currentPeer.name + ' (' + currentPeer.ip + ').\n\nPlease check Wi-Fi connection and retry.');
            }
        }

        function appendBubble(text, type, fileObj) {
            const timeline = document.getElementById('timeline');
            const row = document.createElement('div');
            row.className = 'msg-row ' + type;

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            let content = text;
            if (fileObj) {
                content = `
                    <div class="file-card">
                        <span style="font-size:24px;">📄</span>
                        <div>
                            <strong>${fileObj.name}</strong><br>
                            <small>${fileObj.size}</small>
                        </div>
                    </div>
                    ${text}
                `;
            }

            row.innerHTML = `
                <div class="msg-bubble">${content}</div>
                <div class="msg-time">${timeStr} ${type === 'sent' ? '✓✓' : ''}</div>
            `;

            timeline.appendChild(row);
            timeline.scrollTop = timeline.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (!currentPeer) {
                alert('⚠️ You are not connected to any user.\n\nHow to Fix:\n1. Select an online user from the left list.\n2. Or click "Scan LAN Users" to find nearby devices on your Wi-Fi.');
                return;
            }
            const sizeStr = (file.size / 1024).toFixed(1) + ' KB';
            appendBubble('Sent file over local Wi-Fi: ' + file.name, 'sent', { name: file.name, size: sizeStr });
        }

        function toggleEmojiPicker() {
            const pop = document.getElementById('emoji-popover');
            pop.style.display = pop.style.display === 'grid' ? 'none' : 'grid';
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('msg-input');
            input.value += emoji;
            document.getElementById('emoji-popover').style.display = 'none';
            input.focus();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        function scanLAN() {
            fetchPeers();
            setTimeout(() => {
                alert('⚡ LAN Scan Complete!\nFound ' + users.length + ' nearby user(s) on your Wi-Fi network.');
            }, 500);
        }

        function startCall(type) {
            if (!currentPeer) {
                alert('⚠️ You are not connected to any user.\n\nPlease select an online user on the left list first!');
                return;
            }
            document.getElementById('call-peer-title').innerText = currentPeer.name;
            document.getElementById('call-avatar').innerText = currentPeer.name.charAt(0).toUpperCase();
            document.getElementById('call-status-lbl').innerText = 'Calling ' + currentPeer.name + '...';
            document.getElementById('video-area').style.display = type === 'video' ? 'flex' : 'none';
            document.getElementById('call-modal').style.display = 'flex';
        }

        function endCall() {
            document.getElementById('call-modal').style.display = 'none';
        }

        function openGuide() {
            alert("📖 How to Use WiFili Web Edition Offline:\n\n1. Connect all devices to the SAME Wi-Fi or Mobile Hotspot.\n2. Click 'Scan LAN Users' to discover connected devices on your local network.\n3. Click any user on the left to start chatting, sending files, or calling offline!");
        }

        // Initialize & Live Poll real LAN peers every 2 seconds
        renderUsers([]);
        fetchPeers();
        setInterval(fetchPeers, 2000);
    </script>
</body>
</html>
